# RAG 檢索 golden set(T2.8;§14)。
#
# 用途:CI / 本地冒煙——確認「問題問得到正確文件」。**NEVER 當成檢索品質的最終判準**:
# rerank 等決策的評測 MUST 於上線前以真實內部文件另建 golden set(v1.2 §17 補遺、§G.2)。
#
# 執行前:把 tests/golden/corpus/ 三個檔案上傳到要評測的帳號(狀態需為 ready),
# 再跑 `python scripts/rag_eval.py --user-email <帳號>`。
#
# 欄位:
#   question          - 送入檢索的問句(= 使用者會怎麼問)
#   expected_document - 期望出現在 top-K 的文件檔名(= 上傳時的 filename)
#   expected_keyword  - 可選;命中的 chunk 內容 MUST 含此字串,避免「檔案對但段落錯」被算成命中

- question: 每週最多可以申請幾天遠端工作?
  expected_document: employee_handbook.md
  expected_keyword: 遠端工作

- question: 核心工作時間是幾點到幾點?
  expected_document: employee_handbook.md
  expected_keyword: 核心工作時間

