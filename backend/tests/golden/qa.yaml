- question: 國內住宿一晚的上限是多少?
  expected_document: expense_policy.md
  expected_keyword: 住宿

- question: 自行開車的油資怎麼補貼?
  expected_document: expense_policy.md
  expected_keyword: 每公里

- question: 報銷金額超過十萬需要誰核准?
  expected_document: expense_policy.md
  expected_keyword: 財務長

- question: 密碼長度與更換頻率的規定是什麼?
  expected_document: security_policy.md
